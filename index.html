<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خرج‌یار — دفتر هزینه‌ها</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--accent:#e8722a;--accent2:#2a7de8;--text:#1c1e21;--muted:#888;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Vazirmatn",Tahoma,sans-serif;}
body{background:var(--bg);color:var(--text);padding-bottom:90px;}
header{background:var(--accent);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
.yearRow{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 0;background:var(--card);}
.ytab{padding:7px 16px;border-radius:12px 12px 0 0;background:#eee;border:none;font-size:14px;font-weight:600;white-space:nowrap;}
.ytab.active{background:var(--accent2);color:#fff;}
.monthRow{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid #e5e5e5;}
.mtab{padding:7px 12px;border-radius:16px;background:#f0f0f0;border:none;font-size:13px;white-space:nowrap;}
.mtab.active{background:var(--accent);color:#fff;}
main{padding:12px;}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{color:var(--muted);padding:6px 3px;border-bottom:1px solid #eee;font-size:11px;text-align:right;}
td{padding:7px 3px;border-bottom:1px solid #f2f2f2;}
td input{width:100%;border:none;background:transparent;font-size:13px;text-align:right;}
.btn{display:block;width:100%;padding:12px;margin-top:8px;border:none;border-radius:12px;font-size:15px;background:#eee;}
.btn.primary{background:var(--accent);color:#fff;}
.btn.blue{background:var(--accent2);color:#fff;}
.btn.green{background:var(--text);color:#fff;}
.btn.sm{padding:9px;font-size:13px;}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.toolbar3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.searchbar{display:flex;gap:8px;align-items:center;}
.searchbar input[type=text]{flex:1;padding:10px;border:1px solid #ddd;border-radius:10px;}
.menu{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:10px;border-top:1px solid #eee;}
.menu button{background:none;border:none;font-size:11px;color:var(--muted);}
.menu button.on{color:var(--accent);}
.hidden{display:none;}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;z-index:9;}
#toast.show{opacity:1;}
dialog{border:none;border-radius:16px;padding:20px;max-width:420px;width:92%;}
dialog::backdrop{background:rgba(0,0,0,.4);}
dialog input,dialog textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:10px;}
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,#e8722a,#f5a623);z-index:50;display:flex;align-items:center;justify-content:center;}
.loginBox{background:#fff;border-radius:20px;padding:28px 24px;width:92%;max-width:340px;text-align:center;}
.loginBox input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;text-align:center;}
#loginMsg{font-size:13px;color:#d33;min-height:18px;}
.badge{padding:2px 8px;border-radius:8px;font-size:11px;}
.badge.on{background:#e3f7e9;color:#2e9e5b;}
.badge.off{background:#fdeaea;color:#d33;}
#ctxMenu{position:fixed;z-index:20;background:#fff;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.18);min-width:200px;overflow:hidden;}
#ctxMenu button{display:block;width:100%;padding:13px 18px;border:none;background:none;text-align:right;}
#ctxMenu button.danger{color:#e05252;}
</style>
</head>
<body>
<div id="loginScreen"><div class="loginBox"><h2>📒 خرج‌یار</h2><p>نام کاربری و رمز</p><input id="loginUser" placeholder="نام کاربری"><input id="loginPass" type="password" placeholder="رمز عبور"><label style="font-size:13px;display:flex;gap:6px;justify-content:center;margin-top:8px;"><input type="checkbox" id="rememberMe" checked style="width:auto;"> مرا به خاطر بسپار</label><button class="btn primary" onclick="doLogin()">ورود</button><div id="loginMsg"></div></div></div>
<div id="app" class="hidden">
<header><h1>📒 خرج‌یار <span id="userBadge"></span></h1><span id="syncDot">● در حال اتصال…</span></header>
<div class="yearRow" id="yearTabs"></div>
<div class="monthRow" id="monthTabs"></div>
<main>
<section id="page-expense">
<div class="card searchbar"><input type="text" id="searchBox" placeholder="🔍 جستجو…" oninput="onSearch(this.value)"><label><input type="checkbox" id="searchAll" onchange="onSearch(document.getElementById('searchBox').value)"> همه ماه‌ها</label></div>
<div class="card"><table><thead id="tblHead"></thead><tbody id="rows"></tbody></table><button class="btn" onclick="addRow()">＋ افزودن ردیف</button></div>
<div class="card hidden" id="searchTools"><div><span id="searchCount"></span> <span id="searchTotal"></span></div><div class="toolbar3"><button class="btn green sm" onclick="printSearch()">🖨️ PDF</button><button class="btn blue sm" onclick="searchCSV()">📊 اکسل</button><button class="btn sm" onclick="clearSearch()">✖️ پاک</button></div></div>
<div class="card" id="monthTotalCard"><span>جمع کل این ماه:</span><span id="total">۰ ریال</span></div>
<div class="card toolbar" id="monthTools"><button class="btn primary" onclick="window.print()">🖨️ پرینت ماه</button><button class="btn blue" onclick="shareMonth()">📤 اشتراک</button></div>
<div class="card toolbar" id="monthTools2"><button class="btn green" onclick="monthCSV()">📊 اکسل ماه</button><button class="btn" onclick="openImport()" style="background:#7c4dbe;color:#fff;">📥 وارد کردن</button></div>
</section>
<section id="page-summary" class="hidden"><div class="card"><h3>خلاصه</h3><table><tbody id="summaryRows"></tbody></table><div><span>جمع کل:</span><span id="grandTotal"></span></div></div></section>
<section id="page-settings" class="hidden"><div class="card"><p id="dbInfo"></p></div><div class="card"><button class="btn blue" onclick="exportData()">💾 خروجی</button><button class="btn" onclick="logout()">🚪 خروج</button></div></section>
</main>
<section id="page-admin" class="hidden" style="padding:12px;"><div class="card"><h3>🛡️ پنل ادمین</h3><div style="display:flex;gap:8px;"><input id="admUser" placeholder="یوزر"><input id="admPass" placeholder="رمز"><input id="admExp" placeholder="انقضا"><button class="btn primary" style="width:auto;" onclick="admCreate()">＋ ساخت</button></div></div><div class="card"><table><tbody id="admRows"></tbody></table></div><div class="card"><button class="btn" onclick="location.hash=''">← بازگشت</button></div></section>
<nav class="menu"><button class="on" id="m-expense" onclick="goPage('expense')">🧾 هزینه‌ها</button><button id="m-summary" onclick="goPage('summary')">📊 خلاصه</button><button id="m-settings" onclick="goPage('settings')">⚙️ تنظیمات</button></nav>
<dialog id="dlg"><h3 id="dlgTitle">ماه جدید</h3><input id="monthName" placeholder="نام ماه"><input id="monthYear" placeholder="سال"><div style="display:flex;gap:8px;"><button class="btn primary" onclick="dlgOk()">تأیید</button><button class="btn" onclick="dlg.close()">انصراف</button></div></dialog>
<dialog id="impDlg"><h3>📥 وارد کردن</h3><input type="file" id="impFile"><textarea id="importText"></textarea><input id="impMonth" placeholder="ماه مقصد"><div style="display:flex;gap:8px;"><button class="btn primary" onclick="doImport()">وارد کردن</button><button class="btn" onclick="impDlg.close()">انصراف</button></div><p id="impStatus"></p><div id="impReport" class="hidden"><div id="impReportBody"></div><button class="btn primary" onclick="proceedImport()">✅ ثبت</button><button class="btn" onclick="cancelImport()">✏️ اصلاح</button></div></dialog>
<div id="ctxMenu" class="hidden"></div><div id="toast"></div><div id="printHeader" style="display:none;"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script>
const SUPABASE_URL='https://piczniampmxtbsmzrxiv.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpY3puaWFtcG14dGJzbXpyeGl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MzM4NjgsImV4cCI6MjEwNjEwOTg2OH0.QdSmoxB7nbfrUgL4CuiYT2-O37E_ZAn-qtxH8IpRVII';
const API=SUPABASE_URL.replace(/\/+$/,'')+'/rest/v1';
const impDlg=document.getElementById('impDlg');const dlg=document.getElementById('dlg');
let SESSION_KEY='kharjyar_session';let currentUser=null;let months=[];let currentYear='۱۴۰۵';let currentName='';let page='expense';let online=false;let refreshTimer=null;let pendingRecords=null,pendingParsed=null;let dragSt=null,dragTimer=null;let searchTerm='';let extraYears=[];
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const money=n=>fa(String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'))+' ریال';
const cur=()=>months.find(m=>m.name===currentName&&m.year===currentYear)||months.find(m=>m.year===currentYear)||months[0];
const toast=t=>{const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3200);};
function setDot(s){const d=document.getElementById('syncDot');if(s==='ok'){d.textContent='🟢 سینک فعال';}else if(s==='err'){d.textContent='🟠 خطای اتصال';}else{d.textContent='● در حال اتصال…';}}
async function api(path,opts={}){const res=await fetch(API+path,{method:opts.method||'GET',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',...(opts.prefer?{'Prefer':opts.prefer}:{})},body:opts.body?JSON.stringify(opts.body):undefined});if(!res.ok){const t=await res.text();throw new Error(t.slice(0,200));}return res.status===204?null:res.json();}
function hashPass(p){return Promise.resolve(p);}
function ensureAdminUser(){return api('/users?username=eq.admin&select=*').then(u=>{if(!u||!u.length)return hashPass('1234').then(h=>api('/users',{method:'POST',prefer:'return=minimal',body:{username:'admin',password:h,is_active:true}}).catch(()=>{}));}).catch(()=>{});}
async function doLogin(){const u=document.getElementById('loginUser').value.trim().toLowerCase();const p=document.getElementById('loginPass').value;const msg=document.getElementById('loginMsg');if(!u||!p){msg.textContent='نام کاربری و رمز را بنویس';return;}msg.textContent='⏳ در حال بررسی…';try{const rows=await api('/users?username=eq.'+encodeURIComponent(u)+'&select=*');if(!rows||!rows.length){msg.textContent='❌ چنین کاربری وجود ندارد';return;}const usr=rows[0];if(String(usr.password).trim()!==String(p).trim()){msg.textContent='❌ رمز عبور اشتباه است';return;}if(usr.is_active===false){msg.textContent='⛔ اشتراک تمام شده';return;}currentUser={username:u,isAdmin:u==='admin'};try{if(document.getElementById('rememberMe').checked)localStorage.setItem(SESSION_KEY,u);else localStorage.removeItem(SESSION_KEY);}catch(_){}document.getElementById('loginScreen').style.display='none';document.getElementById('app').classList.remove('hidden');document.getElementById('userBadge').textContent='👤 '+u;msg.textContent='';startSync();routeAdmin();}catch(e){msg.textContent='❌ خطای اتصال: '+e.message;}}
function logout(){if(!confirm('خارج می‌شوی؟'))return;try{localStorage.removeItem(SESSION_KEY);}catch(_){}location.reload();}
function autoLogin(){let u=null;try{u=localStorage.getItem(SESSION_KEY);}catch(_){}if(!u)return false;api('/users?username=eq.'+encodeURIComponent(u)+'&select=*').then(rows=>{if(!rows||!rows.length)return;if(rows[0].is_active===false)return;currentUser={username:u,isAdmin:u==='admin'};document.getElementById('loginScreen').style.display='none';document.getElementById('app').classList.remove('hidden');document.getElementById('userBadge').textContent='👤 '+u;startSync();routeAdmin();}).catch(()=>{});return false;}
function toLatinDigits(s){return String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));}
function onlyDigits(s){return toLatinDigits(s).replace(/[^\d]/g,'');}
function groupDigits(d){return d.replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function div(a,b){return ~~(a/b);}
function parseDate(raw){if(!raw)return null;let s=toLatinDigits(String(raw)).trim();let p=s.split(/[^0-9]+/).filter(Boolean);if(p.length<3)return null;let y=Number(p[0]),m=Number(p[1]),d=Number(p[2]);if(y<200)y+=1400;return y+'/'+String(m).padStart(2,'0')+'/'+String(d).padStart(2,'0');}
const dateKey=s=>{const p=parseDate(s);return p?p.replace(/\//g,''):'99999999';};
function mkey(y,n){return y+'||'+n;}
function rebuild(rows,ml){
let map=new Map();
(rows||[]).forEach(r=>{let y=r.year||currentYear;let k=mkey(y,r.month);if(!map.has(k))map.set(k,[]);map.get(k).push({id:r.id,subject:r.subject,amount:Number(r.amount),date:r.date,bank:r.bank||'',notes:r.notes||''});});
let orderMap=new Map();(ml||[]).forEach(o=>orderMap.set(mkey(o.year||'۱۴۰۵',o.name),o));
let keys=[];(ml||[]).forEach(o=>{let k=mkey(o.year||'۱۴۰۵',o.name);if(!keys.includes(k))keys.push(k);});
map.forEach((v,k)=>{if(!keys.includes(k))keys.push(k);});
months=keys.map(k=>{let[y,name]=k.split('||');let o=orderMap.get(k)||{};return{name:name,year:y,seq:(o.sort!=null?Number(o.sort):9999),rows:map.get(k)||[]};});
if(!months.length&&extraYears.includes(currentYear)){/* سال خالی، ماهی نداریم */}
months.sort((a,b)=>{if(a.year!==b.year)return a.year<b.year?-1:1;return a.seq-b.seq;});
months.forEach(m=>{m.rows.sort((a,b)=>dateKey(a.date)<dateKey(b.date)?-1:1);});
let years=[...new Set(months.map(m=>m.year))];extraYears.forEach(y=>{if(!years.includes(y))years.push(y);});
years.sort();if(!years.includes(currentYear))currentYear=years[0]||currentYear;
let ym=months.filter(m=>m.year===currentYear);
if(!months.find(m=>m.name===currentName&&m.year===currentYear)){currentName=ym.length?ym[0].name:'';}
}
function monthsOfYear(y){return months.filter(m=>m.year===y);}
function allFlat(){return months.flatMap(m=>m.rows.map(r=>({month:m.name,year:m.year,...r})));}
const byId=id=>{for(const m of months){const r=m.rows.find(x=>x.id===id);if(r)return{row:r,month:m};}return null;};
function userBusy(){const a=document.activeElement;return a&&a.tagName==='INPUT'&&!a.closest('dialog');}
async function refresh(silent=true){if(!currentUser)return;if(userBusy()){clearTimeout(refreshTimer);refreshTimer=setTimeout(refresh,2000);return;}try{const data=await api('/expenses?select=*&user_id=eq.'+encodeURIComponent(currentUser.username)+'&is_deleted=eq.false&order=created_at.asc');let ml=[];try{ml=await api('/months_list?select=*&user_id=eq.'+encodeURIComponent(currentUser.username)+'&order=sort.asc');}catch(_){}rebuild(data,ml);render();if(!online){online=true;setDot('ok');document.getElementById('dbInfo').textContent='✅ متصل — '+currentUser.username;} }catch(e){setDot('err');}}
let _syncTimer=null;
function startSync(){refresh();if(_syncTimer)clearInterval(_syncTimer);_syncTimer=setInterval(()=>{if(document.visibilityState!=='hidden'&&currentUser)refresh();},5000);}
async function dbInsertBatch(monthName,rows){const m=months.find(x=>x.name===monthName&&x.year===currentYear);const y=m?m.year:currentYear;const body=rows.map(r=>({month:monthName,year:y,subject:r.subject,amount:r.amount||0,date:r.date,bank:r.bank||'',notes:r.notes||'',user_id:currentUser.username,is_deleted:false,updated_at:new Date().toISOString()}));return api('/expenses',{method:'POST',prefer:'return=representation',body});}
async function dbInsert(row){const m=cur();if(!m)return;try{const out=await api('/expenses',{method:'POST',prefer:'return=representation',body:{month:m.name,year:m.year,subject:row.subject,amount:row.amount||0,date:row.date,bank:row.bank||'',notes:row.notes||'',user_id:currentUser.username,is_deleted:false,updated_at:new Date().toISOString()}});if(out&&out[0])row.id=out[0].id;}catch(e){toast('خطای ذخیره');}}
async function dbUpdate(row){if(!row.id)return;try{await api('/expenses?id=eq.'+row.id,{method:'PATCH',body:{subject:row.subject,amount:row.amount||0,date:row.date,bank:row.bank||'',notes:row.notes||''}});}catch(e){}}
async function dbDelete(id){if(!id)return;try{await api('/expenses?id=eq.'+id,{method:'PATCH',body:{is_deleted:true}});}catch(e){}}
function onSearch(v){searchTerm=v.trim();renderRows();}
function clearSearch(){searchTerm='';document.getElementById('searchBox').value='';renderRows();}
function render(){let years=[...new Set(months.map(m=>m.year))];extrayears.forEach(y=>{const b=document.createElement('button');b.className='ytab'+(y===currentYear?' active':'');b.textContent=fa('سال '+y);let _lt=null,_long=false;b.addEventListener('touchstart',()=>{_long=false;_lt=setTimeout(()=>{_long=true;showYearCtx(y,innerWidth/2,200);},600);},{passive:true});b.addEventListener('touchend',()=>clearTimeout(_lt));b.onclick=()=>{if(_long){_long=false;return;}currentYear=y;let ym=monthsOfYear(y);currentName=ym.length?ym[0].name:'';render();};b.oncontextmenu=e=>{e.preventDefault();showYearCtx(y,e.clientX,e.clientY);};yt.appendChild(b);});
function renderRows(){const r=document.getElementById('rows');r.innerHTML='';const m=cur();if(!m||!m.name){r.innerHTML='<tr><td style="text-align:center;color:#999;padding:20px;">این سال هنوز ماهی ندارد — دکمه ＋ ماه را بزن</td></tr>';document.getElementById('total').textContent='۰ ریال';return;}m.rows.forEach((row,i)=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+fa(i+1)+'</td><td><input value="'+(row.subject||'')+'" oninput="editRow(\''+row.id+'\',\'subject\',this.value)"></td><td><input value="'+(row.amount||'')+'" oninput="editAmount(\''+row.id+'\',this)"></td><td><input value="'+(row.date||'')+'" oninput="editRow(\''+row.id+'\',\'date\',this.value)"></td><td><input value="'+(row.bank||'')+'" oninput="editRow(\''+row.id+'\',\'bank\',this.value)"></td><td><button onclick="delRow(\''+row.id+'\')">✕</button></td>';r.appendChild(tr);});updateTotal();}
let editTimers={};function editAmount(id,inp){const f=byId(id);if(!f)return;f.row.amount=Number(onlyDigits(inp.value)||0);inp.value=f.row.amount?groupDigits(String(f.row.amount)):'';updateTotal();clearTimeout(editTimers[id]);editTimers[id]=setTimeout(()=>dbUpdate(f.row),600);}
function editRow(id,k,v){const f=byId(id);if(!f)return;f.row[k]=v;clearTimeout(editTimers[id+k]);editTimers[id+k]=setTimeout(()=>dbUpdate(f.row),600);}
async function addRow(){const m=cur();if(!m||!m.name)return toast('اول ماه بساز');const row={id:null,subject:'',amount:0,date:'',bank:''};m.rows.push(row);renderRows();await dbInsert(row);}
async function delRow(id){const f=byId(id);if(!f)return;if(!confirm('حذف شود؟'))return;f.month.rows=f.month.rows.filter(x=>x.id!==id);renderRows();await dbDelete(id);}
function updateTotal(){const m=cur();const t=m?m.rows.reduce((s,x)=>s+Number(x.amount||0),0):0;document.getElementById('total').textContent=money(t);const sr=document.getElementById('summaryRows');if(sr){sr.innerHTML='';let g=0;months.forEach(mm=>{const tt=mm.rows.reduce((s,x)=>s+Number(x.amount||0),0);g+=tt;sr.insertAdjacentHTML('beforeend','<tr><td>'+fa(mm.year+' / '+mm.name)+'</td><td>'+money(tt)+'</td></tr>');});document.getElementById('grandTotal').textContent=money(g);}}
function goPage(p){['expense','summary','settings'].forEach(x=>{document.getElementById('page-'+x).classList.toggle('hidden',x!==p);document.getElementById('m-'+x).classList.toggle('on',x===p);});}
function shareMonth(){const m=cur();if(!m)return;let t='📒 '+m.name+' '+m.year+'\n';m.rows.forEach((r,i)=>{t+=(i+1)+'. '+(r.subject||'—')+' | '+money(r.amount)+'\n';});if(navigator.share)navigator.share({text:t}).catch(()=>{});}
function monthCSV(){const m=cur();if(!m)return;let csv='\uFEFFموضوع,مبلغ,تاریخ,بانک\n';m.rows.forEach(r=>{csv+='"'+(r.subject||'')+'",'+(r.amount||0)+',"'+(r.date||'')+'","'+(r.bank||'')+'"\n';});dl(new Blob([csv],{type:'text/csv'}),m.name+'.csv');}
function searchResults(){if(!searchTerm)return[];return months.flatMap(m=>m.rows.map(r=>({month:m,row:r}))).filter(x=>(x.row.subject||'').includes(searchTerm));}
function searchCSV(){toast('به‌زودی');}function printSearch(){window.print();}
function exportData(){dl(new Blob([JSON.stringify(allFlat())],{type:'application/json'}),'backup.json');}
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();}
function openImport(){impDlg.showModal();}
function parseTextTable(t){return{records:[],bad:[]};}async function doImport(){toast('متن را خط به خط وارد کن');}async function proceedImport(){}function cancelImport(){}
function addYear(){const v=prompt('نام سال جدید (مثلاً ۱۴۰۶):','');if(!v)return;let s=toLatinDigits(v.trim()).replace(/[^\d]/g,'');if(!s)return;let yn=s.length===2?'14'+s:s;let years=[...new Set(months.map(m=>m.year))].concat(extraYears);if(years.includes(yn))return toast('⚠️ این سال قبلاً ساخته شده');extraYears.push(yn);try{localStorage.setItem('kharjyar_years_'+currentUser.username,JSON.stringify(extraYears));}catch(_){}currentYear=yn;currentName='';render();toast('سال '+fa(yn)+' ساخته شد ✅ حالا ＋ ماه را بزن');}
function openMonthDialog(mode){document.getElementById('monthName').value='';document.getElementById('monthYear').value=currentYear;dlg.dataset.mode=mode;dlg.dataset.oldname=showCtxName||'';dlg.showModal();}
function dlgOk(){const v=document.getElementById('monthName').value.trim();if(!v)return toast('نام ماه را بنویس');dlg.close();if(dlg.dataset.mode==='rename'){renameMonth(dlg.dataset.oldname,v,document.getElementById('monthYear').value.trim()||currentYear);return;}const yn=document.getElementById('monthYear').value.trim()||currentYear;if(months.find(m=>m.name===v&&m.year===yn))return toast('⚠️ این ماه در این سال قبلاً ساخته شده');months.push({name:v,year:yn,seq:months.length+1,rows:[]});currentName=v;currentYear=yn;api('/months_list',{method:'POST',prefer:'return=minimal',body:{name:v,sort:months.length,year:yn,user_id:currentUser.username}}).catch(()=>{});render();toast('ماه ساخته شد ✅');}
async function renameMonth(oldName,newName,newYear){const m=months.find(x=>x.name===oldName&&x.year===currentYear);if(!m)return;if(months.find(x=>x.name===newName&&x.year===newYear&&x!==m))return toast('تکراری است');m.name=newName;m.year=newYear||m.year;currentName=newName;render();try{await api('/expenses?month=eq.'+encodeURIComponent(oldName)+'&year=eq.'+encodeURIComponent(currentYear)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'PATCH',body:{month:newName,year:m.year}});}catch(e){}try{await api('/months_list?name=eq.'+encodeURIComponent(oldName)+'&year=eq.'+encodeURIComponent(currentYear)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'PATCH',body:{name:newName,year:m.year}});}catch(e){}}
async function deleteMonth(name){const i=months.findIndex(x=>x.name===name&&x.year===currentYear);if(i<0)return;if(!confirm('ماه «'+name+'» حذف شود؟'))return;const m=months[i];try{await api('/expenses?month=eq.'+encodeURIComponent(m.name)+'&year=eq.'+encodeURIComponent(m.year)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'PATCH',body:{is_deleted:true}});}catch(e){}try{await api('/months_list?name=eq.'+encodeURIComponent(m.name)+'&year=eq.'+encodeURIComponent(m.year)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'DELETE'});}catch(e){}months.splice(i,1);currentName='';render();}
let showCtxName='';function showCtx(name,x,y){showCtxName=name;const m=document.getElementById('ctxMenu');m.innerHTML='';const mk=(l,fn)=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{m.classList.add('hidden');fn();};m.appendChild(b);};mk('✏️ تغییر نام',()=>openMonthDialog('rename'));mk('🗑️ حذف',()=>deleteMonth(name));m.classList.remove('hidden');m.style.left='20px';m.style.top='200px';}
function showYearCtx(y,x,yy){const m=document.getElementById('ctxMenu');m.innerHTML='';const mk=(l,cls,fn)=>{const b=document.createElement('button');b.textContent=l;if(cls)b.className=cls;b.onclick=()=>{m.classList.add('hidden');fn();};m.appendChild(b);};mk('✏️ ویرایش نام سال',()=>renameYear(y));mk('↔️ جابه‌جایی سال',()=>moveYearNumeric(y));mk('🗑️ حذف سال','danger',()=>deleteYear(y));m.classList.remove('hidden');m.style.left='20px';m.style.top='150px';}
async function renameYear(oldY){const v=prompt('نام جدید سال:',oldY);if(!v)return;const ny=toLatinDigits(v).replace(/[^\d]/g,'');if(!ny||ny===oldY)return;months.filter(m=>m.year===oldY).forEach(m=>m.year=ny);extraYears=extraYears.map(y=>y===oldY?ny:y);currentYear=ny;render();try{await api('/expenses?year=eq.'+encodeURIComponent(oldY)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'PATCH',body:{year:ny}});}catch(e){}try{await api('/months_list?year=eq.'+encodeURIComponent(oldY)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'PATCH',body:{year:ny}});}catch(e){}toast('سال عوض شد ✅');}
async function deleteYear(y){const ms=months.filter(m=>m.year===y);if(!confirm('سال '+y+' با '+ms.length+' ماه حذف شود؟'))return;if(ms.length&&!confirm('مطمئنی؟ قابل بازگشت نیست'))return;try{await api('/expenses?year=eq.'+encodeURIComponent(y)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'PATCH',body:{is_deleted:true}});}catch(e){}try{await api('/months_list?year=eq.'+encodeURIComponent(y)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'DELETE'});}catch(e){}months=months.filter(m=>m.year!==y);extraYears=extraYears.filter(x=>x!==y);currentYear=(months[0]||{}).year||extraYears[0]||'۱۴۰۵';render();toast('سال حذف شد 🗑️');}
function moveYearNumeric(y){toast('ترتیب سال‌ها خودکار مرتب است');}
function hideCtx(){document.getElementById('ctxMenu').classList.add('hidden');}
document.addEventListener('click',e=>{if(!e.target.closest('#ctxMenu'))hideCtx();});
function routeAdmin(){const isA=location.hash==='#admin';const s=document.getElementById('page-admin');const menu=document.querySelector('nav.menu');if(!isA){s.classList.add('hidden');if(menu)menu.style.display='flex';return;}if(!currentUser)return;if(!currentUser.isAdmin){toast('⛔ فقط ادمین');location.hash='';return;}s.classList.remove('hidden');if(menu)menu.style.display='none';loadAdmin();}
window.addEventListener('hashchange',routeAdmin);
async function loadAdmin(){try{const users=await api('/users?select=*&order=username.asc');const tb=document.getElementById('admRows');tb.innerHTML='';users.forEach(u=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+u.username+'</td><td>'+(u.is_active!==false?'فعال':'غیرفعال')+'</td><td><button onclick="admDel(\''+u.username+'\')">🗑️</button></td>';tb.appendChild(tr);});}catch(e){}}
async function admCreate(){const u=document.getElementById('admUser').value.trim().toLowerCase();const p=document.getElementById('admPass').value;if(!u||!p)return toast('یوزر و رمز');try{await api('/users',{method:'POST',prefer:'return=minimal',body:{username:u,password:p,is_active:true}});toast('ساخته شد ✅');loadAdmin();}catch(e){toast('❌ '+e.message);}}
async function admDel(u){if(u==='admin')return toast('⛔ ادمین نه');if(!confirm('حذف '+u+'؟'))return;try{await api('/users?username=eq.'+u,{method:'DELETE'});loadAdmin();}catch(e){}}
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
routeAdmin();if(!autoLogin()){ensureAdminUser();}
</script>
