<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خرج‌یار — دفتر هزینه‌ها</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--accent:#e8722a;--accent2:#2a7de8;--text:#1c1e21;--muted:#888;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Tahoma,sans-serif;}
body{background:var(--bg);color:var(--text);padding-bottom:90px;}
header{background:var(--accent);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
.yearRow{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 0;background:var(--card);}
.ytab{padding:7px 16px;border-radius:12px 12px 0 0;background:#eee;border:none;font-size:14px;font-weight:600;white-space:nowrap;}
.ytab.active{background:var(--accent2);color:#fff;}
.monthRow{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid #e5e5e5;}
.mtab{padding:7px 12px;border-radius:16px;background:#f0f0f0;border:none;font-size:13px;white-space:nowrap;}
.mtab.active{background:var(--accent);color:#fff;}
main{padding:12px;}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{color:var(--muted);padding:6px 3px;border-bottom:1px solid #eee;font-size:11px;text-align:right;}
td{padding:7px 3px;border-bottom:1px solid #f2f2f2;}
td input{width:100%;border:none;background:transparent;font-size:13px;text-align:right;}
.btn{display:block;width:100%;padding:12px;margin-top:8px;border:none;border-radius:12px;font-size:15px;background:#eee;}
.btn.primary{background:var(--accent);color:#fff;}
.btn.blue{background:var(--accent2);color:#fff;}
.menu{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:10px;border-top:1px solid #eee;}
.menu button{background:none;border:none;font-size:11px;color:var(--muted);}
.menu button.on{color:var(--accent);}
.hidden{display:none;}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;z-index:9;max-width:85%;text-align:center;}
#toast.show{opacity:1;}
dialog{border:none;border-radius:16px;padding:20px;max-width:420px;width:92%;}
dialog::backdrop{background:rgba(0,0,0,.4);}
dialog input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:10px;}
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,#e8722a,#f5a623);z-index:50;display:flex;align-items:center;justify-content:center;}
.loginBox{background:#fff;border-radius:20px;padding:28px 24px;width:92%;max-width:340px;text-align:center;}
.loginBox input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;text-align:center;}
#loginMsg{font-size:13px;color:#d33;min-height:18px;}
#ctxMenu{position:fixed;z-index:20;background:#fff;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.18);min-width:210px;overflow:hidden;}
#ctxMenu button{display:block;width:100%;padding:13px 18px;border:none;background:none;text-align:right;font-size:14px;}
#ctxMenu button.danger{color:#e05252;}
</style>
</head>
<body>
<div id="loginScreen"><div class="loginBox"><h2>📒 خرج‌یار</h2><p>نام کاربری و رمز</p><input id="loginUser" placeholder="نام کاربری"><input id="loginPass" type="password" placeholder="رمز عبور"><label style="font-size:13px;display:flex;gap:6px;justify-content:center;margin-top:8px;"><input type="checkbox" id="rememberMe" checked style="width:auto;"> مرا به خاطر بسپار</label><button class="btn primary" onclick="doLogin()">ورود</button><div id="loginMsg"></div></div></div>
<div id="app" class="hidden">
<header><h1>📒 خرج‌یار <span id="userBadge"></span></h1><span id="syncDot">● در حال اتصال…</span></header>
<div class="yearRow" id="yearTabs"></div>
<div class="monthRow" id="monthTabs"></div>
<main>
<section id="page-expense">
<div class="card"><table><thead><tr><th>#</th><th>موضوع</th><th>مبلغ</th><th>تاریخ</th><th>بانک</th><th></th></tr></thead><tbody id="rows"></tbody></table><button class="btn" onclick="addRow()">＋ افزودن ردیف</button></div>
<div class="card"><span>جمع کل این ماه:</span> <span id="total">۰ ریال</span></div>
</section>
<section id="page-summary" class="hidden"><div class="card"><h3>خلاصه</h3><table><tbody id="summaryRows"></tbody></table><div>جمع کل: <span id="grandTotal"></span></div></div></section>
<section id="page-settings" class="hidden"><div class="card"><p id="dbInfo"></p></div><div class="card"><button class="btn" onclick="logout()">🚪 خروج</button></div></section>
</main>
<section id="page-admin" class="hidden" style="padding:12px;"><div class="card"><h3>🛡️ پنل ادمین</h3><div style="display:flex;gap:8px;"><input id="admUser" placeholder="یوزر" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;"><input id="admPass" placeholder="رمز" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;"><button class="btn primary" style="width:auto;margin:0;" onclick="admCreate()">＋ ساخت</button></div></div><div class="card"><table><tbody id="admRows"></tbody></table></div><div class="card"><button class="btn" onclick="location.hash=''">← بازگشت</button></div></section>
<nav class="menu"><button class="on" id="m-expense" onclick="goPage('expense')">🧾 هزینه‌ها</button><button id="m-summary" onclick="goPage('summary')">📊 خلاصه</button><button id="m-settings" onclick="goPage('settings')">⚙️ تنظیمات</button></nav>
<dialog id="dlg"><h3 id="dlgTitle">ماه جدید</h3><input id="monthName" placeholder="نام ماه"><input id="monthYear" placeholder="سال"><div style="display:flex;gap:8px;"><button class="btn primary" onclick="dlgOk()">تأیید</button><button class="btn" onclick="document.getElementById('dlg').close()">انصراف</button></div></dialog>
<dialog id="yearDlg"><h3 id="yearDlgTitle">سال</h3><input id="yearInput" placeholder="مثلاً ۱۴۰۶"><div style="display:flex;gap:8px;"><button class="btn primary" onclick="yearDlgOk()">تأیید</button><button class="btn" onclick="document.getElementById('yearDlg').close()">انصراف</button></div></dialog>
<div id="ctxMenu" class="hidden"></div><div id="toast"></div>
</div>
<script>
var SUPABASE_URL='https://piczniampmxtbsmzrxiv.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpY3puaWFtcG14dGJzbXpyeGl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MzM4NjgsImV4cCI6MjEwNjEwOTg2OH0.QdSmoxB7nbfrUgL4CuiYT2-O37E_ZAn-qtxH8IpRVII';
var API=SUPABASE_URL.replace(/\/+$/,'')+'/rest/v1';
var SESSION_KEY='kharjyar_session';
var currentUser=null;
var months=[];
var currentYear='1405';
var currentName='';
var online=false;
var refreshTimer=null;
var syncTimer=null;
var showCtxName='';
var yearMode='new';
var yearOld='';
var yearOrder=[];
function fa(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d];});}
function money(n){var s=String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');return fa(s)+' ریال';}
function cur(){for(var i=0;i<months.length;i++){if(months[i].name===currentName&&String(months[i].year)===String(currentYear))return months[i];}for(var j=0;j<months.length;j++){if(String(months[j].year)===String(currentYear))return months[j];}return months[0];}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2600);}
function setDot(s){var d=document.getElementById('syncDot');if(s==='ok')d.textContent='🟢 سینک فعال';else if(s==='err')d.textContent='🟠 خطای اتصال';else d.textContent='● در حال اتصال…';}
function api(path,opts){opts=opts||{};return fetch(API+path,{method:opts.method||'GET',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:opts.body?JSON.stringify(opts.body):undefined}).then(function(res){if(!res.ok)return res.text().then(function(t){throw new Error(t.slice(0,250));});if(res.status===204)return null;return res.json();});}
function ensureAdminUser(){return api('/users?username=eq.admin&select=*').then(function(u){if(!u||!u.length){return api('/users',{method:'POST',body:{username:'admin',password:'1234',is_active:true}}).catch(function(){});}}).catch(function(){});}
function doLogin(){var u=document.getElementById('loginUser').value.trim().toLowerCase();var p=document.getElementById('loginPass').value;var msg=document.getElementById('loginMsg');if(!u||!p){msg.textContent='نام کاربری و رمز را بنویس';return;}msg.textContent='⏳ در حال بررسی…';api('/users?username=eq.'+encodeURIComponent(u)+'&select=*').then(function(rows){if(!rows||!rows.length){msg.textContent='❌ چنین کاربری وجود ندارد';return;}var usr=rows[0];if(String(usr.password).trim()!==String(p).trim()){msg.textContent='❌ رمز عبور اشتباه است';return;}if(usr.is_active===false){msg.textContent='⛔ اشتراک تمام شده';return;}currentUser={username:u,isAdmin:(u==='admin')};try{if(document.getElementById('rememberMe').checked){localStorage.setItem(SESSION_KEY,u);}else{localStorage.removeItem(SESSION_KEY);}}catch(e){}document.getElementById('loginScreen').style.display='none';document.getElementById('app').classList.remove('hidden');document.getElementById('userBadge').textContent='👤 '+u;msg.textContent='';loadYearOrder();startSync();routeAdmin();}).catch(function(e){msg.textContent='❌ خطای اتصال: '+e.message;});}
function logout(){if(!confirm('خارج می‌شوی؟'))return;try{localStorage.removeItem(SESSION_KEY);}catch(e){}location.reload();}
function autoLogin(){var u=null;try{u=localStorage.getItem(SESSION_KEY);}catch(e){}if(!u)return false;api('/users?username=eq.'+encodeURIComponent(u)+'&select=*').then(function(rows){if(!rows||!rows.length)return;if(rows[0].is_active===false)return;currentUser={username:u,isAdmin:(u==='admin')};document.getElementById('loginScreen').style.display='none';document.getElementById('app').classList.remove('hidden');document.getElementById('userBadge').textContent='👤 '+u;loadYearOrder();startSync();routeAdmin();}).catch(function(){});return false;}
function toLatinDigits(s){return String(s).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d);});}
function onlyDigits(s){return toLatinDigits(s).replace(/[^\d]/g,'');}
function groupDigits(d){return d.replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function mkey(y,n){return String(y)+'||'+String(n);}
function rebuild(rows,ml){var map={};(rows||[]).forEach(function(r){var y=r.year||currentYear;var k=mkey(y,r.month);if(!map[k])map[k]=[];map[k].push({id:r.id,subject:r.subject,amount:Number(r.amount),date:r.date,bank:r.bank||''});});var orderMap={};(ml||[]).forEach(function(o){orderMap[mkey(o.year||'1405',o.name)]=o;});var keys=[];(ml||[]).forEach(function(o){var k=mkey(o.year||'1405',o.name);if(keys.indexOf(k)<0)keys.push(k);});for(var k2 in map){if(keys.indexOf(k2)<0)keys.push(k2);}months=keys.map(function(k){var sp=k.split('||');var y=sp[0];var name=sp[1];var o=orderMap[k]||{};return{name:name,year:y,seq:(o.sort!=null?Number(o.sort):9999),rows:map[k]||[]};});months.sort(function(a,b){if(String(a.year)!==String(b.year))return String(a.year)<String(b.year)?-1:1;return a.seq-b.seq;});var years=getYears();if(years.indexOf(String(currentYear))<0&&years.length)currentYear=years[0];var ym=months.filter(function(m){return String(m.year)===String(currentYear);});var found=null;for(var i=0;i<months.length;i++){if(months[i].name===currentName&&String(months[i].year)===String(currentYear)){found=months[i];break;}}if(!found)currentName=ym.length?ym[0].name:'';}
function getYears(){var s=[];months.forEach(function(m){var y=String(m.year);if(s.indexOf(y)<0)s.push(y);});yearOrder.forEach(function(y){y=String(y);if(s.indexOf(y)<0)s.push(y);});s.sort();if(!s.length)s=[String(currentYear)];return s;}
function monthsOfYear(y){return months.filter(function(m){return String(m.year)===String(y);});}
function byId(id){for(var i=0;i<months.length;i++){for(var j=0;j<months[i].rows.length;j++){if(String(months[i].rows[j].id)===String(id))return{row:months[i].rows[j],month:months[i]};}}return null;}
function userBusy(){var a=document.activeElement;return a&&a.tagName==='INPUT';}
function refresh(){if(!currentUser)return;if(userBusy()){clearTimeout(refreshTimer);refreshTimer=setTimeout(refresh,2000);return;}api('/expenses?select=*&user_id=eq.'+encodeURIComponent(currentUser.username)+'&is_deleted=eq.false&order=created_at.asc').then(function(data){return api('/months_list?select=*&user_id=eq.'+encodeURIComponent(currentUser.username)+'&order=sort.asc').then(function(ml){return{data:data,ml:ml};}).catch(function(){return{data:data,ml:[]};});}).then(function(o){rebuild(o.data,o.ml);render();if(!online){online=true;setDot('ok');document.getElementById('dbInfo').textContent='✅ متصل — '+currentUser.username;}}).catch(function(){setDot('err');});}
function startSync(){refresh();if(syncTimer)clearInterval(syncTimer);syncTimer=setInterval(function(){if(document.visibilityState!=='hidden'&&currentUser)refresh();},8000);}
function loadYearOrder(){try{var s=localStorage.getItem('khy_years_'+currentUser.username);if(s)yearOrder=JSON.parse(s);}catch(e){yearOrder=[];}}
function saveYearOrder(){try{localStorage.setItem('khy_years_'+currentUser.username,JSON.stringify(yearOrder));}catch(e){}}
function dbInsert(row){var m=cur();if(!m||!m.name)return Promise.resolve();return api('/expenses',{method:'POST',body:{month:m.name,year:String(m.year),subject:row.subject,amount:row.amount||0,date:row.date,bank:row.bank||'',user_id:currentUser.username,is_deleted:false}}).then(function(out){if(out&&out[0])row.id=out[0].id;}).catch(function(e){toast('خطای ذخیره: '+e.message);});}
function dbUpdate(row){if(!row.id)return;api('/expenses?id=eq.'+row.id,{method:'PATCH',body:{subject:row.subject,amount:row.amount||0,date:row.date,bank:row.bank||''}}).catch(function(){});}
function dbDelete(id){if(!id)return Promise.resolve();return api('/expenses?id=eq.'+id,{method:'PATCH',body:{is_deleted:true}}).catch(function(){});}
function render(){var years=getYears();if(years.indexOf(String(currentYear))<0)currentYear=years[0];var yt=document.getElementById('yearTabs');yt.innerHTML='';years.forEach(function(y){var b=document.createElement('button');b.className='ytab'+(String(y)===String(currentYear)?' active':'');b.textContent=fa('سال '+y);var lt=null;var isLong=false;b.addEventListener('touchstart',function(){isLong=false;lt=setTimeout(function(){isLong=true;showYearCtx(y);},550);},{passive:true});b.addEventListener('touchend',function(){if(lt)clearTimeout(lt);});b.addEventListener('click',function(){if(isLong){isLong=false;return;}currentYear=y;var ym=monthsOfYear(y);currentName=ym.length?ym[0].name:'';render();});b.oncontextmenu=function(e){e.preventDefault();showYearCtx(y);};yt.appendChild(b);});var ya=document.createElement('button');ya.className='ytab';ya.textContent='＋ سال جدید';ya.onclick=function(){yearMode='new';document.getElementById('yearDlgTitle').textContent='سال جدید';document.getElementById('yearInput').value='';document.getElementById('yearDlg').showModal();};yt.appendChild(ya);var mt=document.getElementById('monthTabs');mt.innerHTML='';monthsOfYear(currentYear).forEach(function(m){var b2=document.createElement('button');b2.className='mtab'+(m.name===currentName?' active':'');b2.textContent=fa(m.name);b2.onclick=function(){currentName=m.name;render();};b2.oncontextmenu=function(e){e.preventDefault();showCtx(m.name);};mt.appendChild(b2);});var ma=document.createElement('button');ma.className='mtab';ma.textContent='＋ ماه';ma.onclick=function(){document.getElementById('dlg').dataset.mode='new';document.getElementById('dlgTitle').textContent='ماه جدید در سال '+fa(currentYear);document.getElementById('monthName').value='';document.getElementById('monthYear').value=currentYear;document.getElementById('dlg').showModal();};mt.appendChild(ma);renderRows();}
var editTimers={};
function renderRows(){var r=document.getElementById('rows');r.innerHTML='';var m=cur();if(!m||!m.name){r.innerHTML='<tr><td style="text-align:center;color:#999;padding:20px;">این سال هنوز ماهی ندارد — ＋ ماه را بزن</td></tr>';document.getElementById('total').textContent='۰ ریال';return;}m.rows.forEach(function(row,i){var tr=document.createElement('tr');var td0=document.createElement('td');td0.textContent=fa(i+1);tr.appendChild(td0);var inp0=document.createElement('input');inp0.value=row.subject||'';var td1=document.createElement('td');td1.appendChild(inp0);tr.appendChild(td1);var inp1=document.createElement('input');inp1.value=row.amount?groupDigits(String(Math.round(row.amount))):'';var td2=document.createElement('td');td2.appendChild(inp1);tr.appendChild(td2);var inp2=document.createElement('input');inp2.value=row.date||'';var td3=document.createElement('td');td3.appendChild(inp2);tr.appendChild(td3);var inp3=document.createElement('input');inp3.value=row.bank||'';var td4=document.createElement('td');td4.appendChild(inp3);tr.appendChild(td4);var tdD=document.createElement('td');var del=document.createElement('button');del.textContent='✕';tdD.appendChild(del);tr.appendChild(tdD);inp0.oninput=function(){row.subject=this.value;queueUpdate(row);};inp1.oninput=function(){var d=onlyDigits(this.value);row.amount=Number(d||0);this.value=d?groupDigits(d):'';updateTotal();queueUpdate(row);};inp2.oninput=function(){row.date=toLatinDigits(this.value);queueUpdate(row);};inp3.oninput=function(){row.bank=this.value;queueUpdate(row);};del.onclick=function(){delRow(row.id);};r.appendChild(tr);});updateTotal();}
function queueUpdate(row){updateTotal();var k=row.id||'noid';clearTimeout(editTimers[k]);editTimers[k]=setTimeout(function(){dbUpdate(row);},700);}
function addRow(){var m=cur();if(!m||!m.name){toast('اول ماه بساز');return;}var row={id:null,subject:'',amount:0,date:'',bank:''};m.rows.push(row);renderRows();dbInsert(row).then(function(){renderRows();});}
function delRow(id){var f=byId(id);if(!f)return;if(!confirm('حذف شود؟'))return;f.month.rows=f.month.rows.filter(function(x){return String(x.id)!==String(id);});renderRows();dbDelete(id);}
function updateTotal(){var m=cur();var t=0;if(m&&m.rows){for(var i=0;i<m.rows.length;i++){t+=Number(m.rows[i].amount||0);}}document.getElementById('total').textContent=money(t);var sr=document.getElementById('summaryRows');if(sr){sr.innerHTML='';var g=0;months.forEach(function(mm){var tt=0;for(var k=0;k<mm.rows.length;k++){tt+=Number(mm.rows[k].amount||0);}g+=tt;var tr=document.createElement('tr');var td1=document.createElement('td');td1.textContent=fa(mm.year+' / '+mm.name);var td2=document.createElement('td');td2.textContent=money(tt);tr.appendChild(td1);tr.appendChild(td2);sr.appendChild(tr);});document.getElementById('grandTotal').textContent=money(g);}}
function goPage(p){var arr=['expense','summary','settings'];for(var i=0;i<arr.length;i++){var x=arr[i];document.getElementById('page-'+x).classList.toggle('hidden',x!==p);document.getElementById('m-'+x).classList.toggle('on',x===p);}}
function dlgOk(){var v=document.getElementById('monthName').value.trim();if(!v){toast('نام ماه را بنویس');return;}var yn=document.getElementById('monthYear').value.trim()||String(currentYear);document.getElementById('dlg').close();if(document.getElementById('dlg').dataset.mode==='rename'){renameMonth(showCtxName,v,yn);return;}for(var i=0;i<months.length;i++){if(months[i].name===v&&String(months[i].year)===String(yn)){toast('این ماه در این سال هست');return;}}months.push({name:v,year:yn,seq:months.length+1,rows:[]});currentName=v;currentYear=yn;render();api('/months_list',{method:'POST',body:{name:v,sort:months.length,year:yn,user_id:currentUser.username}}).then(function(){refresh();}).catch(function(e){toast('ثبت نشد: '+e.message);refresh();});}
function renameMonth(oldName,newName,newYear){var m=null;for(var i=0;i<months.length;i++){if(months[i].name===oldName&&String(months[i].year)===String(currentYear)){m=months[i];break;}}if(!m)return;var oldY=m.year;m.name=newName;m.year=newYear||m.year;currentName=newName;currentYear=m.year;render();api('/expenses?month=eq.'+encodeURIComponent(oldName)+'&year=eq.'+encodeURIComponent(oldY)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'PATCH',body:{month:newName,year:String(m.year)}}).catch(function(){});api('/months_list?name=eq.'+encodeURIComponent(oldName)+'&year=eq.'+encodeURIComponent(oldY)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'PATCH',body:{name:newName,year:String(m.year)}}).catch(function(){});}
function deleteMonth(name){var idx=-1;for(var i=0;i<months.length;i++){if(months[i].name===name&&String(months[i].year)===String(currentYear)){idx=i;break;}}if(idx<0)return;if(!confirm('ماه '+name+' حذف شود؟'))return;var m=months[idx];api('/expenses?month=eq.'+encodeURIComponent(m.name)+'&year=eq.'+encodeURIComponent(m.year)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'PATCH',body:{is_deleted:true}}).catch(function(){});api('/months_list?name=eq.'+encodeURIComponent(m.name)+'&year=eq.'+encodeURIComponent(m.year)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'DELETE',body:{}}).catch(function(){});months.splice(idx,1);currentName='';render();setTimeout(refresh,500);}
function yearDlgOk(){var v=toLatinDigits(document.getElementById('yearInput').value.trim()).replace(/[^\d]/g,'');if(!v){toast('سال را بنویس');return;}if(v.length===2)v='14'+v;document.getElementById('yearDlg').close();if(yearMode==='rename'){doRenameYear(yearOld,v);return;}var years=getYears();if(years.indexOf(v)>=0){toast('این سال هست');return;}yearOrder.push(v);saveYearOrder();currentYear=v;currentName='';render();toast('سال '+fa(v)+' ساخته شد');}
function doRenameYear(oldY,newY){if(String(oldY)===String(newY))return;months.forEach(function(m){if(String(m.year)===String(oldY))m.year=newY;});yearOrder=yearOrder.map(function(y){return String(y)===String(oldY)?newY:y;});if(yearOrder.indexOf(newY)<0)yearOrder.push(newY);saveYearOrder();currentYear=newY;render();api('/expenses?year=eq.'+encodeURIComponent(oldY)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'PATCH',body:{year:newY}}).catch(function(){});api('/months_list?year=eq.'+encodeURIComponent(oldY)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'PATCH',body:{year:newY}}).catch(function(){});toast('سال عوض شد');}
function deleteYear(y){var ms=months.filter(function(m){return String(m.year)===String(y);});if(!confirm('سال '+y+' با '+ms.length+' ماه حذف شود؟'))return;api('/expenses?year=eq.'+encodeURIComponent(y)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'PATCH',body:{is_deleted:true}}).catch(function(){});api('/months_list?year=eq.'+encodeURIComponent(y)+'&user_id=eq.'+encodeURIComponent(currentUser.username),{method:'DELETE',body:{}}).catch(function(){});months=months.filter(function(m){return String(m.year)!==String(y);});yearOrder=yearOrder.filter(function(x){return String(x)!==String(y);});saveYearOrder();var ys=getYears();currentYear=ys.length?ys[0]:'1405';currentName='';render();setTimeout(refresh,500);}
function moveYear(y){var years=getYears();var i=years.indexOf(String(y));var v=prompt('جایگاه جدید سال '+y+' (1 تا '+years.length+'): ',String(i+1));if(!v)return;var j=Number(toLatinDigits(v))-1;if(isNaN(j)||j<0||j>=years.length){toast('نامعتبر');return;}years.splice(i,1);years.splice(j,0,String(y));yearOrder=years.slice();saveYearOrder();render();toast('جابه‌جا شد');}
function showCtx(name){showCtxName=name;var m=document.getElementById('ctxMenu');m.innerHTML='';function mk(l,fn){var b=document.createElement('button');b.textContent=l;b.onclick=function(){m.classList.add('hidden');fn();};m.appendChild(b);}mk('✏️ تغییر نام',function(){document.getElementById('dlg').dataset.mode='rename';document.getElementById('dlgTitle').textContent='تغییر نام ماه';document.getElementById('monthName').value=name;document.getElementById('monthYear').value=currentYear;document.getElementById('dlg').showModal();});mk('🗑️ حذف ماه',function(){deleteMonth(name);});m.classList.remove('hidden');m.style.left='20px';m.style.top='200px';}
function showYearCtx(y){var m=document.getElementById('ctxMenu');m.innerHTML='';function mk(l,cls,fn){var b=document.createElement('button');b.textContent=l;if(cls)b.className=cls;b.onclick=function(){m.classList.add('hidden');fn();};m.appendChild(b);}mk('✏️ ویرایش نام سال',null,function(){yearMode='rename';yearOld=String(y);document.getElementById('yearDlgTitle').textContent='ویرایش سال '+fa(y);document.getElementById('yearInput').value=String(y);document.getElementById('yearDlg').showModal();});mk('↔️ جابه‌جایی سال',null,function(){moveYear(y);});mk('🗑️ حذف سال','danger',function(){deleteYear(y);});m.classList.remove('hidden');m.style.left='20px';m.style.top='150px';}
document.addEventListener('click',function(e){if(!e.target.closest('#ctxMenu'))document.getElementById('ctxMenu').classList.add('hidden');});
function routeAdmin(){var isA=location.hash==='#admin';var s=document.getElementById('page-admin');var menu=document.querySelector('nav.menu');if(!isA){s.classList.add('hidden');if(menu)menu.style.display='flex';return;}if(!currentUser)return;if(!currentUser.isAdmin){toast('⛔ فقط ادمین');location.hash='';return;}s.classList.remove('hidden');if(menu)menu.style.display='none';loadAdmin();}
window.addEventListener('hashchange',routeAdmin);
function loadAdmin(){api('/users?select=*&order=username.asc').then(function(users){var tb=document.getElementById('admRows');tb.innerHTML='';users.forEach(function(u){var tr=document.createElement('tr');var td1=document.createElement('td');td1.textContent=u.username+' - '+(u.is_active!==false?'فعال':'غیرفعال');tr.appendChild(td1);var td2=document.createElement('td');var b=document.createElement('button');b.textContent='🗑️';b.onclick=function(){admDel(u.username);};td2.appendChild(b);tr.appendChild(td2);tb.appendChild(tr);});}).catch(function(){});}
function admCreate(){var u=document.getElementById('admUser').value.trim().toLowerCase();var p=document.getElementById('admPass').value;if(!u||!p){toast('یوزر و رمز');return;}api('/users',{method:'POST',body:{username:u,password:p,is_active:true}}).then(function(){toast('ساخته شد');loadAdmin();}).catch(function(e){toast(e.message);});}
function admDel(u){if(u==='admin'){toast('ادمین نه');return;}if(!confirm('حذف '+u+'؟'))return;api('/users?username=eq.'+u,{method:'DELETE',body:{}}).then(function(){loadAdmin();}).catch(function(e){toast(e.message);});}
document.getElementById('loginPass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
routeAdmin();
if(!autoLogin()){ensureAdminUser();}
</script>
</body>
